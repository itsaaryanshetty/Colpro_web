# ## Step 5: Your Final Folder Structure Should Look Like


services:
  frontend:
    image: itsaaryanshetty/colpro-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: itsaaryanshetty/colpro-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - ./backend_fastapi/.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Chinnu@290105
      POSTGRES_DB: colpro_practice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: